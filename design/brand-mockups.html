<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>little unknown · brand mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#eef0ec; --ink:#121512; --muted:#5b625b; --rule:#d5dad3; --night:#0f120f; --moon:#e6ebe5; --a:#ef4b2b; }
  * { box-sizing:border-box; margin:0; }
  body { padding:40px 16px 80px; background:#e4e7e2; color:var(--ink); font-family:"JetBrains Mono", ui-monospace, Menlo, monospace; }
  .page { max-width:1200px; margin:0 auto; }
  header.top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:28px; font-size:13px; color:var(--muted); }
  h2 { font-size:12px; font-weight:400; color:var(--muted); margin:48px 0 14px; letter-spacing:.02em; }
  .grid { display:grid; gap:16px; }
  .g2 { grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); }
  .g3 { grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); }
  .panel { border-radius:16px; overflow:hidden; background:var(--paper); min-height:220px; display:flex; align-items:center; justify-content:center; padding:40px 28px; position:relative; }
  .panel.dark { background:var(--night); color:var(--moon); }
  .panel.white { background:#fff; }
  .panel.signal { background:var(--a); color:#fff; --ink:#fff; }
  .cap { position:absolute; left:16px; bottom:12px; font-size:11px; color:var(--muted); }
  .dark .cap { color:#7d877d; } .signal .cap { color:#ffd9cf; }

  /* wordmark: big "unknown" with "little" tucked into the empty space above "un" */
  .wm { position:relative; display:inline-block; font-weight:700; letter-spacing:-0.04em; line-height:1; white-space:nowrap; }
  .wm .l { position:absolute; left:.05em; top:-.035em; font-size:.27em; line-height:1; font-weight:500; letter-spacing:0; color:var(--a); }
  .signal .wm .l { color:var(--night); }
  .lockup { display:inline-flex; align-items:center; gap:.42em; }
  .lockup svg { flex:none; }

  .acc { fill:var(--a); }
  .signal .acc { fill:var(--night); }
  @media (prefers-reduced-motion: no-preference) {
    /* only the hero mark twinkles: one lit dot at a time dims briefly */
    .tw .acc { animation:tw 4.5s ease-in-out infinite; }
    .tw .acc:nth-of-type(2) { animation-delay:1.5s; } .tw .acc:nth-of-type(3) { animation-delay:3s; }
    @keyframes tw { 0%,70%,100% { opacity:1 } 85% { opacity:.55 } }
  }

  /* phone */
  .phone { width:260px; height:520px; border-radius:42px; background:linear-gradient(160deg, #2b322b, #151915); padding:14px; box-shadow:0 30px 60px -20px rgba(0,0,0,.35); }
  .screen { width:100%; height:100%; border-radius:30px; background:linear-gradient(180deg, #c9d2c6, #9fac9b); padding:52px 18px 18px; display:grid; grid-template-columns:repeat(4, 1fr); grid-auto-rows:min-content; gap:18px 12px; font-family:-apple-system, system-ui, sans-serif; }
  .app { display:flex; flex-direction:column; align-items:center; gap:5px; font-size:9px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25); }
  .app i { width:46px; height:46px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
  .app.ph i { background:rgba(255,255,255,.45); }

  /* browser */
  .browser { width:100%; max-width:560px; border-radius:12px; overflow:hidden; background:#fff; box-shadow:0 20px 50px -24px rgba(0,0,0,.3); }
  .chrome { background:#dfe3dd; padding:10px 12px 0; display:flex; gap:6px; align-items:flex-end; }
  .dots3 { display:flex; gap:6px; margin:0 8px 10px 0; } .dots3 b { width:10px; height:10px; border-radius:50%; background:#c4c9c2; }
  .tab { display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--paper); border-radius:9px 9px 0 0; font:12px -apple-system, system-ui, sans-serif; }
  .site { background:var(--paper); padding:22px 26px 38px; }
  .site nav { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:40px; }
  .site .tag { color:var(--muted); font-size:12px; margin-top:12px; }

  /* card */
  .card { width:300px; height:172px; border-radius:10px; padding:20px 22px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 18px 40px -20px rgba(0,0,0,.35); }
  .card.front { background:var(--night); color:var(--moon); }
  .card.back { background:#fff; color:var(--ink); }
  .card small { font-size:10px; color:var(--muted); line-height:1.6; } .card.front small { color:#7d877d; }

  /* social */
  .social { width:100%; max-width:440px; background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 18px 40px -24px rgba(0,0,0,.3); font-family:-apple-system, system-ui, sans-serif; }
  .banner { height:120px; background:var(--night); display:flex; align-items:center; justify-content:flex-end; padding-right:28px; color:var(--moon); }
  .avatar { width:84px; height:84px; border-radius:50%; background:var(--night); border:4px solid #fff; margin:-42px 0 0 18px; display:flex; align-items:center; justify-content:center; }
  .who { padding:8px 18px 18px; font-size:13px; color:#555; } .who b { display:block; font-size:16px; color:#111; }

  /* og */
  .og { width:100%; max-width:600px; aspect-ratio:1200/630; background:var(--night); color:var(--moon); border-radius:12px; padding:6% 7%; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 20px 50px -24px rgba(0,0,0,.35); }
  .og small { color:#7d877d; font-size:12px; }

  /* sticker on laptop */
  .laptop { width:100%; max-width:420px; aspect-ratio:16/10; border-radius:16px; background:linear-gradient(150deg, #b9bfba, #8d948e); display:flex; align-items:center; justify-content:center; }
  .sticker { width:120px; height:120px; border-radius:50%; background:var(--night); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px -6px rgba(0,0,0,.4); border:5px solid #fff; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
// The mark: a band of known dots with three little unknowns lit.
const PAT = ["ooaooo", "oooaoo", "oaoooo"];
// At favicon sizes the band is simplified to 3 x 2 with one lit dot.
const PAT_SMALL = ["oao", "ooo"];
function mark(size, { pat = PAT, ink = "currentColor", tw = false } = {}) {
  const rows = pat.length, cols = pat[0].length;
  const step = 84 / cols, r = step * 0.36;
  const ox = 50 - (cols - 1) * step / 2, oy = 50 - (rows - 1) * step / 2;
  let dots = "";
  pat.forEach((row, y) => [...row].forEach((ch, x) => {
    const cx = (ox + x * step).toFixed(1), cy = (oy + y * step).toFixed(1);
    dots += ch === "a" ? `<circle class="acc" cx="${cx}" cy="${cy}" r="${r.toFixed(1)}"/>` : `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="${ink}"/>`;
  }));
  return `<svg class="${tw ? "tw" : ""}" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${dots}</svg>`;
}
const wm = (px) => `<span class="wm" style="font-size:${px}px"><span class="l">little</span>unknown</span>`;
const lockup = (px) => `<span class="lockup" style="font-size:${px}px">${mark(px * 1.5)}${wm(px)}</span>`;
const icon = (s, r) => `<div style="width:${s}px;height:${s}px;border-radius:${r}px;background:var(--night);color:var(--moon);display:flex;align-items:center;justify-content:center">${mark(s * 0.78)}</div>`;

document.getElementById("page").innerHTML = `
  <header class="top"><span>${lockup(18)}</span><span>brand mockups · v1</span></header>

  <h2>// primary lockup</h2>
  <div class="grid g2">
    <div class="panel white">${lockup(58)}<span class="cap">on light</span></div>
    <div class="panel dark">${lockup(58)}<span class="cap">on dark</span></div>
  </div>

  <h2>// mark and wordmark</h2>
  <div class="grid g3">
    <div class="panel">${mark(150, { tw: true })}<span class="cap">mark · the lit dots gently pulse</span></div>
    <div class="panel white">${wm(64)}<span class="cap">wordmark</span></div>
    <div class="panel signal">${lockup(40)}<span class="cap">one-colour, on vermilion</span></div>
  </div>

  <h2>// app icon and favicon</h2>
  <div class="grid g3">
    <div class="panel white" style="gap:22px;flex-wrap:wrap">${icon(120, 27)}${icon(64, 15)}${icon(40, 9)}<span class="cap">app icon · 120 / 64 / 40</span></div>
    <div class="panel" style="gap:26px;color:var(--ink)">${mark(48, { pat: PAT_SMALL })}${mark(32, { pat: PAT_SMALL })}${mark(16, { pat: PAT_SMALL })}<span class="cap">favicon, simplified for small sizes · 48 / 32 / 16</span></div>
    <div class="panel white" style="padding:0;align-items:flex-end;justify-content:flex-start;padding:40px 24px 0">
      <div class="tab" style="color:var(--ink)">${mark(16, { pat: PAT_SMALL, tw: false })}little unknown · product studio</div><span class="cap" style="bottom:auto;top:12px">browser tab</span>
    </div>
  </div>

  <h2>// in the world</h2>
  <div class="grid g2">
    <div class="panel" style="background:#d5dbd2">
      <div class="phone"><div class="screen">
        ${'<div class="app ph"><i></i>App</div>'.repeat(5)}
        <div class="app"><i style="background:var(--night);color:var(--moon)">${mark(34)}</i>little unknown</div>
        ${'<div class="app ph"><i></i>App</div>'.repeat(6)}
      </div></div>
      <span class="cap">home screen</span>
    </div>
    <div class="panel" style="background:#d5dbd2">
      <div class="browser">
        <div class="chrome"><div class="dots3"><b></b><b></b><b></b></div><div class="tab">${mark(16, { pat: PAT_SMALL, tw: false })}little unknown</div></div>
        <div class="site">
          <nav><span>// product studio</span><span>work · about</span></nav>
          ${lockup(40)}
          <div class="tag">// everything starts unknown</div>
        </div>
      </div>
      <span class="cap">littleunknown.com</span>
    </div>
  </div>

  <div class="grid g2" style="margin-top:16px">
    <div class="panel" style="background:#cfd6cc;gap:18px;flex-wrap:wrap">
      <div class="card front">${mark(46)}<div>${wm(26)}</div></div>
      <div class="card back"><div>${wm(18)}</div><small>naman vashistha<br>founder<br><br>littleunknown.com</small></div>
      <span class="cap">business card · front and back</span>
    </div>
    <div class="panel" style="background:#d5dbd2">
      <div class="social">
        <div class="banner">${wm(30)}</div>
        <div class="avatar" style="color:var(--moon)">${mark(56)}</div>
        <div class="who"><b>little unknown</b>@littleunknown · product studio<br>everything starts unknown.</div>
      </div>
      <span class="cap">social profile</span>
    </div>
  </div>

  <div class="grid g2" style="margin-top:16px">
    <div class="panel" style="background:#d5dbd2">
      <div class="og"><small>// product studio</small>${lockup(44)}<small>littleunknown.com</small></div>
      <span class="cap">link preview</span>
    </div>
    <div class="panel" style="background:#d5dbd2">
      <div class="laptop"><div class="sticker" style="color:var(--moon)">${mark(84)}</div></div>
      <span class="cap">sticker</span>
    </div>
  </div>
`;
</script>
</body>
</html>
