<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chairside — paediatric dental prescribing</title>
    <meta name="description" content="AAPD-sourced antibiotic, antifungal, antiviral and analgesic doses for children, worked out from weight and age. Decision support for dentists. Works offline." />
    <meta name="theme-color" content="#f6f6f3" />
    <script>
      // Light by default; dark only if this viewer chose it. Runs before paint so there's no flash.
      (function () {
        var t = "light";
        try { if (localStorage.getItem("chairside.theme") === "dark") t = "dark"; } catch (e) {}
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f0f0e");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chairside" />
    <link rel="canonical" href="https://littleunknown.com/chairside/" />
    <link rel="icon" href="/chairside/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/chairside/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Chairside needs JavaScript to work out doses.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
