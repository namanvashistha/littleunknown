<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>little unknown</title>
  <meta name="description" content="Something little, still unknown.">
  <style>
    :root { --bg: #f6f3ee; --fg: #1d1b18; --muted: #8a847a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141312; --fg: #ece8e1; --muted: #7d776e; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      display: grid; place-items: center; padding: 16px;
    }
    main { text-align: center; }
    h1 { font-weight: 400; font-size: clamp(2.5rem, 9vw, 5.5rem); letter-spacing: -0.02em; }
    p {
      margin-top: 1rem; color: var(--muted);
      font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <main>
    <h1>little unknown</h1>
    <p>something is coming</p>
  </main>
</body>
</html>
